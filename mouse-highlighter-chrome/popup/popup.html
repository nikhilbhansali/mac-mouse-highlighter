<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Mouse Highlighter</title>
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Mouse Highlighter</h1>
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <section class="settings-section">
      <h2>Highlight Style</h2>
      <div class="style-grid">
        <button class="style-btn active" data-style="circle" title="Circle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor" opacity="0.6"/></svg>
          <span>Circle</span>
        </button>
        <button class="style-btn" data-style="ring" title="Ring">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Ring</span>
        </button>
        <button class="style-btn" data-style="spotlight" title="Spotlight">
          <svg viewBox="0 0 24 24">
            <rect x="0" y="0" width="24" height="24" fill="currentColor" opacity="0.3"/>
            <circle cx="12" cy="12" r="6" fill="white"/>
          </svg>
          <span>Spotlight</span>
        </button>
        <button class="style-btn" data-style="crosshair" title="Crosshair">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2"/>
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Crosshair</span>
        </button>
        <button class="style-btn" data-style="pulse" title="Pulse">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
          </svg>
          <span>Pulse</span>
        </button>
      </div>
    </section>

    <section class="settings-section">
      <h2>Quick Settings</h2>

      <div class="setting-row">
        <label for="sizeSlider">Size</label>
        <input type="range" id="sizeSlider" min="20" max="100" value="40">
        <span id="sizeValue">40px</span>
      </div>

      <div class="setting-row">
        <label for="colorPicker">Color</label>
        <input type="color" id="colorPicker" value="#ffd60a">
      </div>

      <div class="setting-row">
        <label for="opacitySlider">Opacity</label>
        <input type="range" id="opacitySlider" min="10" max="100" value="60">
        <span id="opacityValue">60%</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>Click Effects</h2>
      <div class="setting-row">
        <label for="clickEffectToggle">Enable click effects</label>
        <label class="toggle-switch small">
          <input type="checkbox" id="clickEffectToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="effect-grid" id="effectGrid">
        <button class="effect-btn active" data-effect="ripple">Ripple</button>
        <button class="effect-btn" data-effect="colorFlash">Flash</button>
        <button class="effect-btn" data-effect="shrinkBounce">Bounce</button>
      </div>
    </section>

    <footer class="popup-footer">
      <a href="#" id="openOptions">More Settings</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
